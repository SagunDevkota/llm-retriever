[project]
name = "hierarchical-rag"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "openai>=2.43.0",
    "openpyxl>=3.1.5",
    "playwright>=1.60.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "ragas>=0.4.3",
    "rapidfuzz>=3.14.5",
    "rouge-score>=0.1.2",
    "tqdm>=4.68.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.1",
]
